version: "1.0"
template_id: image-generation
display_name: "图片生成基础参数"

schema:
  groups:
    - id: input
      label: "输入"
      fields: [prompt, negative_prompt]
      ui_zone: main_input

    - id: generation
      label: "生成设置"
      fields: [aspect_ratio, width, height, style, quality]
      ui_zone: params

    - id: advanced
      label: "高级"
      fields: [seed, cfg_scale, steps]
      collapsed: true
      ui_zone: advanced

  properties:
    prompt:
      type: text
      label: "提示词"
      placeholder: "描述你想生成的图片..."
      max_length: 4000
      ui_width: full
      ui_component: prompt_editor

    negative_prompt:
      type: text
      label: "反向提示词"
      placeholder: "不想出现的内容..."
      max_length: 2000
      ui_width: full
      ui_hidden: true

    aspect_ratio:
      type: enum
      label: "宽高比"
      enum_options:
        - { value: "1:1", label: "1:1 方形", icon: "square" }
        - { value: "16:9", label: "16:9 横屏", icon: "landscape" }
        - { value: "9:16", label: "9:16 竖屏", icon: "portrait" }
        - { value: "4:3", label: "4:3", icon: "landscape" }
        - { value: "3:4", label: "3:4", icon: "portrait" }
        - { value: "custom", label: "自定义" }
      default: "1:1"
      ui_component: aspect_ratio_picker
      ui_width: full

    width:
      type: integer
      label: "宽度"
      min: 256
      max: 4096
      step: 64
      default: 1024
      ui_width: half
      visible_when: { field: aspect_ratio, op: eq, value: custom }

    height:
      type: integer
      label: "高度"
      min: 256
      max: 4096
      step: 64
      default: 1024
      ui_width: half
      visible_when: { field: aspect_ratio, op: eq, value: custom }

    style:
      type: enum
      label: "风格"
      enum_options:
        - { value: "natural", label: "自然" }
        - { value: "vivid", label: "鲜明" }
        - { value: "anime", label: "动漫" }
        - { value: "photographic", label: "摄影" }
        - { value: "digital_art", label: "数字艺术" }
      default: "natural"
      ui_width: half

    quality:
      type: enum
      label: "质量"
      enum_options:
        - { value: "standard", label: "标准" }
        - { value: "hd", label: "高清" }
      default: "standard"
      ui_width: half

    seed:
      type: integer
      label: "随机种子"
      min: -1
      max: 2147483647
      default: -1
      description: "-1 表示随机"
      ui_component: seed_input

    cfg_scale:
      type: slider
      label: "引导系数 (CFG)"
      description: "控制提示词的影响强度"
      min: 1
      max: 30
      step: 0.5
      default: 7

    steps:
      type: integer
      label: "生成步数"
      description: "采样步数，越多质量越高但速度越慢"
      min: 1
      max: 150
      default: 30

  required: [prompt]
  defaults:
    aspect_ratio: "1:1"
    width: 1024
    height: 1024
    style: "natural"
    quality: "standard"
    seed: -1
    cfg_scale: 7
    steps: 30
