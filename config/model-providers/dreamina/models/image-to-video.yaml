version: "1.0"
provider_slug: dreamina
models:
  - resource_uid: 301d5141-a572-4440-8715-60bd9bc194f2
    revision: 1
    model_id: dreamina:image2video
    provider_model_id: image2video
    display_name: 即梦图生视频
    description: 单张图片生成视频动画
    task_types:
      - gen.video
    capabilities:
      - image_ref
    invocation_mode: async
    adapter_key: dreamina-cli
    allowed_channel_slugs:
      - dreamina-cli
    tags:
      - 视频
      - 图生视频
    input_contract:
      default_mode: image_to_video
      modes:
        - id: image_to_video
          label: 图生视频
          required_slots:
            - slot: source_image
              type: image
              min: 1
              max: 1
              library:
                kinds:
                  - character
                  - style
                forms:
                  - material
    param_schema:
      version: "1.0"
      groups:
        - { id: input, label: 输入, fields: [prompt], ui_zone: main_input }
        - { id: generation, label: 生成设置, fields: [duration, model_version], ui_zone: params }
      properties:
        prompt: { type: text, label: 提示词 }
        duration: { type: number, label: 时长（秒）, min: 4, max: 15 }
        model_version:
          type: enum
          label: 模型版本
          enum_options:
            - { value: seedance1.0fast, label: Seedance 1.0 Fast }
            - { value: seedance1.0, label: Seedance 1.0 }
            - { value: seedance1.5pro, label: Seedance 1.5 Pro }
            - { value: seedance2.0, label: Seedance 2.0 }
            - { value: seedance2.0fast, label: Seedance 2.0 Fast }
            - { value: seedance2.0_vip, label: Seedance 2.0 VIP }
            - { value: seedance2.0fast_vip, label: Seedance 2.0 Fast VIP }
            - { value: seedance2.0mini, label: Seedance 2.0 Mini }
      required: [prompt]
      defaults: { duration: 5, model_version: seedance2.0fast }
