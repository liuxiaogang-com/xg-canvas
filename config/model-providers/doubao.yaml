version: "1.0"

provider:
  slug: doubao
  display_name: "豆包 (字节跳动)"
  icon_url: "/icons/doubao.svg"
  homepage_url: "https://www.volcengine.com/product/doubao"
  auth_method: api_key
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  default_invocation_method: http
  sdk_package: "@volcengine/openapi"
  supported_regions: ["cn"]
  description: "字节跳动豆包大模型平台，包含文本、图片、视频生成能力"

channels:
  - slug: doubao-http
    display_name: "豆包官方 HTTP API"
    invocation_method: http
    load_balance_strategy: round_robin
    rate_limit_rpm: 60
    concurrent_limit: 10

  - slug: jimeng-cli
    display_name: "即梦 CLI 调用"
    invocation_method: cli
    concurrent_limit: 3
    request_config:
      cli_command: "jimeng"
      work_dir: "/opt/jimeng"
      timeout_ms: 300000

models:
  # ---- 文本生成模型 ----
  - model_id: "doubao:doubao-pro-32k"
    provider_model_id: "doubao-pro-32k"
    display_name: "豆包 Pro 32K"
    description: "豆包高性能对话模型，32K 上下文"
    task_types: [gen.text]
    capabilities: [text_chat, vision, json_mode, streaming]
    invocation_mode: stream
    supports_streaming: true
    tags: ["推荐"]
    allowed_channel_ids: []  # 空 = doubao-http 渠道
    param_schema:
      extends: "templates/text-generation"
    limits:
      max_input_tokens: 32000
      max_output_tokens: 4096
    pricing:
      unit: token
      input_price_per_1k: 0.0008
      output_price_per_1k: 0.002
      currency: CNY

  - model_id: "doubao:doubao-lite-32k"
    provider_model_id: "doubao-lite-32k"
    display_name: "豆包 Lite 32K"
    description: "豆包轻量模型，速度快成本低"
    task_types: [gen.text]
    capabilities: [text_chat, json_mode, streaming]
    invocation_mode: stream
    supports_streaming: true
    tags: ["高性价比"]
    param_schema:
      extends: "templates/text-generation"
    limits:
      max_input_tokens: 32000
      max_output_tokens: 4096
    pricing:
      unit: token
      input_price_per_1k: 0.0003
      output_price_per_1k: 0.0006
      currency: CNY

  # ---- 视频生成模型 ----
  - model_id: "doubao:seedance-2.0"
    provider_model_id: "seedance-2.0"
    display_name: "Seedance 2.0 视频生成"
    description: "字节跳动最新视频生成模型，支持文本生成、首帧、首尾帧等多种模式"
    task_types: [gen.video]
    capabilities: [first_last_frame, multi_reference]
    invocation_mode: async
    supports_streaming: false
    tags: ["推荐", "新"]
    input_contract:
      default_mode: text_to_video
      modes:
        - id: text_to_video
          label: 文生视频
        - id: image_to_video
          label: 图生视频
          required_slots:
            - { slot: source_image, type: image, min: 1, max: 1, library: { kinds: [character, style], forms: [material] } }
        - id: first_last_frame
          label: 首尾帧
          required_slots:
            - { slot: first_frame, type: image, min: 1, max: 1 }
            - { slot: last_frame, type: image, min: 1, max: 1 }
        - id: reference_to_video
          label: 参考图生成
          required_slots:
            - { slot: reference_image, type: image, min: 1, max: 4, library: { kinds: [character, style], forms: [material] } }
    param_schema:
      extends: "templates/video-generation"
      override:
        groups:
          - id: input
            label: "输入"
            fields: [prompt, negative_prompt]
            ui_zone: main_input
          - id: generation
            label: "生成设置"
            fields: [aspect_ratio, duration]
            ui_zone: params
          - id: advanced
            label: "高级"
            fields: [seed]
            collapsed: true
            ui_zone: advanced
        properties:
          duration:
            type: enum
            label: "时长"
            enum_options:
              - { value: 5, label: "5 秒" }
              - { value: 10, label: "10 秒" }
            default: 5
            ui_width: half
        required: [prompt]
        defaults:
          aspect_ratio: "16:9"
          duration: 5
          seed: -1
    limits:
      max_duration_seconds: 10
      supported_formats: ["mp4"]
      max_resolution: { width: 1920, height: 1080 }
    pricing:
      unit: second
      price_per_second: 0.05
      currency: CNY

  - model_id: "doubao:seedance-1.0"
    provider_model_id: "seedance-1.0"
    display_name: "Seedance 1.0 视频生成"
    description: "上一代视频生成模型"
    task_types: [gen.video]
    capabilities: []
    invocation_mode: async
    supports_streaming: false
    deprecated: true
    deprecated_message: "建议使用 Seedance 2.0"
    input_contract:
      default_mode: text_to_video
      modes:
        - id: text_to_video
          label: 文生视频
    param_schema:
      extends: "templates/video-generation"
      override:
        groups:
          - id: input
            label: "输入"
            fields: [prompt]
            ui_zone: main_input
          - id: generation
            label: "生成设置"
            fields: [aspect_ratio, duration]
            ui_zone: params
        properties:
          duration:
            type: enum
            label: "时长"
            enum_options:
              - { value: 4, label: "4 秒" }
            default: 4
            ui_width: half
        required: [prompt]
        defaults:
          aspect_ratio: "16:9"
          duration: 4
    limits:
      max_duration_seconds: 4
    pricing:
      unit: second
      price_per_second: 0.03
      currency: CNY
