version: "1.0"

provider:
  slug: openai
  display_name: "OpenAI"
  icon_url: "/icons/openai.svg"
  homepage_url: "https://platform.openai.com"
  auth_method: api_key
  base_url: "https://api.openai.com/v1"
  default_invocation_method: http
  sdk_package: "openai"
  supported_regions: ["global"]
  description: "OpenAI API，提供 GPT 系列模型和 DALL·E 图片生成"

channels:
  - slug: openai-official
    display_name: "OpenAI 官方 API"
    invocation_method: http
    load_balance_strategy: round_robin
    rate_limit_rpm: 500
    concurrent_limit: 50

models:
  # ---- 文本生成模型 ----
  - model_id: "openai:gpt-4o"
    provider_model_id: "gpt-4o"
    display_name: "GPT-4o"
    description: "最强大的多模态模型，支持文本和图片理解"
    task_types: [gen.text]
    capabilities: [text_chat, vision, json_mode, structured_output, tool_use, streaming]
    invocation_mode: stream
    supports_streaming: true
    tags: ["推荐"]
    param_schema:
      extends: "templates/text-generation"
    limits:
      max_input_tokens: 128000
      max_output_tokens: 16384
    pricing:
      unit: token
      input_price_per_1k: 0.0025
      output_price_per_1k: 0.01
      currency: USD

  - model_id: "openai:gpt-4o-mini"
    provider_model_id: "gpt-4o-mini"
    display_name: "GPT-4o Mini"
    description: "轻量高速模型，适合简单任务"
    task_types: [gen.text]
    capabilities: [text_chat, vision, json_mode, structured_output, tool_use, streaming]
    invocation_mode: stream
    supports_streaming: true
    tags: ["高性价比"]
    param_schema:
      extends: "templates/text-generation"
    limits:
      max_input_tokens: 128000
      max_output_tokens: 16384
    pricing:
      unit: token
      input_price_per_1k: 0.00015
      output_price_per_1k: 0.0006
      currency: USD

  # ---- 图片生成模型 ----
  - model_id: "openai:dall-e-3"
    provider_model_id: "dall-e-3"
    display_name: "DALL·E 3"
    description: "高质量图片生成"
    task_types: [gen.image]
    capabilities: [image_gen]
    invocation_mode: sync
    supports_streaming: false
    input_contract:
      default_mode: text_to_image
      modes:
        - id: text_to_image
          label: 文生图
    param_schema:
      extends: "templates/image-generation"
      override:
        # DALL-E 3 不支持 cfg_scale/steps 等参数，移除相关组和字段
        groups:
          - id: input
            label: "输入"
            fields: [prompt]
            ui_zone: main_input
          - id: generation
            label: "生成设置"
            fields: [size, style, quality]
            ui_zone: params
        properties:
          size:
            type: enum
            label: "尺寸"
            enum_options:
              - { value: "1024x1024", label: "1024x1024 方形" }
              - { value: "1792x1024", label: "1792x1024 横屏" }
              - { value: "1024x1792", label: "1024x1792 竖屏" }
            default: "1024x1024"
            ui_width: full
          style:
            type: enum
            label: "风格"
            enum_options:
              - { value: "natural", label: "自然" }
              - { value: "vivid", label: "鲜明" }
            default: "vivid"
            ui_width: half
          quality:
            type: enum
            label: "质量"
            enum_options:
              - { value: "standard", label: "标准" }
              - { value: "hd", label: "高清" }
            default: "standard"
            ui_width: half
        required: [prompt]
        defaults:
          size: "1024x1024"
          style: "vivid"
          quality: "standard"
    limits:
      max_input_tokens: 4000
    pricing:
      unit: image
      standard_price: 0.04
      hd_price: 0.08
      currency: USD
