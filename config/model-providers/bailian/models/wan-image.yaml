              type: image
              min: 1
              max: 9
              library:
                kinds:
                  - character
                  - style
                forms:
                  - material
    param_schema:
      version: "1.0"
      groups:
        - { id: input, label: 输入, fields: [prompt, negative_prompt], ui_zone: main_input }
        - { id: generation, label: 生成设置, fields: [size, n], ui_zone: params }
        - { id: advanced, label: 高级, fields: [thinking_mode, watermark, seed], ui_zone: advanced }
      properties:
        prompt: { type: text, label: 提示词, max_length: 2100 }
        negative_prompt: { type: text, label: 反向提示词, max_length: 500 }
        size:
          type: enum
          label: 质量档位
          enum_options:
            - { value: 1K, label: 1K }
            - { value: 2K, label: 2K }
            - { value: 4K, label: 4K }
        n: { type: integer, label: 张数, min: 1, max: 4, step: 1 }
        thinking_mode: { type: boolean, label: 思考模式 }
        watermark: { type: boolean, label: 添加水印 }
        seed: { type: integer, label: 随机种子, min: 0, max: 2147483647 }
      required: [prompt]
      defaults: { size: 1K, n: 1, thinking_mode: true, watermark: false }
    limits:
      max_images_per_request: 4
      max_prompt_chars: 2100
      max_negative_prompt_chars: 500
      max_reference_images: 9
    pricing:
      resource_uid: 402ec8df-6cf6-464e-88a9-756a9e731dc4
      revision: 1
      currency: CNY
      components:
        - meter: image_count
          per: 1
          price: 0.12
