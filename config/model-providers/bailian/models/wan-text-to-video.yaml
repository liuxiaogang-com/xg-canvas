version: "1.0"
provider_slug: bailian
models:
  - resource_uid: 7afff4ec-ead3-4d71-a923-985c6fb04dc4
    revision: 1
    model_id: bailian:wan2.7-t2v
    provider_model_id: wan2.7-t2v
    display_name: 万相 2.7 文生视频
    description: 万相 2.7 文生视频，DashScope 异步接口，2-15 秒。
    task_types:
      - gen.video
    capabilities:
      - video_gen
    invocation_mode: async
    adapter_key: bailian-dashscope
    allowed_channel_slugs:
      - bailian-dashscope-native
    tags:
      - 视频
      - 文生视频
    input_contract:
      default_mode: text_to_video
      modes:
        - id: text_to_video
          label: 文生视频
    param_schema:
      version: "1.0"
      groups:
        - { id: input, label: 输入, fields: [prompt, negative_prompt], ui_zone: main_input }
        - { id: generation, label: 生成设置, fields: [ratio, resolution, duration], ui_zone: params }
        - { id: advanced, label: 高级, fields: [prompt_extend, watermark, seed], ui_zone: advanced }
      properties:
        prompt: { type: text, label: 提示词, max_length: 5000 }
        negative_prompt: { type: text, label: 反向提示词, max_length: 500 }
        ratio:
          type: enum
          label: 比例
          enum_options:
            - { value: "16:9", label: "16:9" }
            - { value: "9:16", label: "9:16" }
            - { value: "1:1", label: "1:1" }
            - { value: "4:3", label: "4:3" }
            - { value: "3:4", label: "3:4" }
        resolution:
          type: enum
          label: 分辨率
          enum_options:
            - { value: 720P, label: 720P }
            - { value: 1080P, label: 1080P }
        duration: { type: integer, label: 时长（秒）, min: 2, max: 15, step: 1 }
        prompt_extend: { type: boolean, label: 智能改写提示词 }
        watermark: { type: boolean, label: 添加水印 }
        seed: { type: integer, label: 随机种子, min: 0, max: 2147483647 }
      required: [prompt]
      defaults: { ratio: "16:9", resolution: 1080P, duration: 5, prompt_extend: true, watermark: false }
    poll_policy:
      initial_delay_ms: 5000
      interval_ms: 10000
      max_total_ms: 600000
    limits:
      min_duration_sec: 2
      max_duration_sec: 15
      max_prompt_chars: 5000
    pricing:
      resource_uid: 5fd975e1-4712-4134-a38e-0e47702df600
      revision: 1
      currency: CNY
      components:
        - meter: duration_seconds
          per: 1
          price: 0.3
